name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build and test debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log
        shell: bash

      - name: Report Gradle failure details
        if: failure()
        shell: bash
        run: |
          diagnostic="$(grep -E '^(FAILURE:|\* What went wrong:|Execution failed for task|Could not resolve|Could not find|e: |> )' build.log | tail -n 20 || true)"
          if [[ -z "$diagnostic" ]]; then
            diagnostic="Gradle failed without a recognized diagnostic; inspect the workflow log."
          fi
          printf '## Gradle failure details\n\n```text\n%s\n```\n' "$diagnostic" >> "$GITHUB_STEP_SUMMARY"
          diagnostic="${diagnostic//$'\n'/ | }"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          echo "::error title=Gradle build failure::$diagnostic"

      - uses: actions/upload-artifact@v7
        with:
          name: eting-android-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
